apiVersion: v1
kind: ServiceAccount
metadata:
  name: insighthub-day5-bot-readonly
  namespace: insighthub-dev
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: insighthub-day5-scale
  namespace: insighthub-dev
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insighthub-day5-bot-readonly
  namespace: insighthub-dev
rules:
  - apiGroups: [""]
    resources: [pods, events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insighthub-day5-bot-readonly
  namespace: insighthub-dev
subjects:
  - kind: ServiceAccount
    name: insighthub-day5-bot-readonly
    namespace: insighthub-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insighthub-day5-bot-readonly
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insighthub-day5-scale
  namespace: insighthub-dev
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [insighthub-api]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments/scale]
    resourceNames: [insighthub-api]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insighthub-day5-scale
  namespace: insighthub-dev
subjects:
  - kind: ServiceAccount
    name: insighthub-day5-scale
    namespace: insighthub-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insighthub-day5-scale
