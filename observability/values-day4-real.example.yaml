# Non-secret example. API keys and the actual provider/model configuration belong
# in the existing insighthub-runtime Secret and must never be committed.
applicationNamespace: insighthub-dev

faultProxy:
  enabled: true
  image: insighthub-api:day4
  # Set this to the reviewed OpenAI-compatible upstream origin. Preserve paths
  # through the proxy; do not include credentials, query strings or fragments.
  upstreamOrigin: https://api.openai.com

alerting:
  slack:
    enabled: true
    channel: "#alerts"
    secretName: insighthub-alertmanager-slack
    secretKey: api-url
