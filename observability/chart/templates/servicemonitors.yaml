apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: insighthub-api
  labels:
    release: {{ .Values.monitoringRelease }}
spec:
  namespaceSelector:
    matchNames: [{{ .Values.applicationNamespace }}]
  selector:
    matchLabels:
      app.kubernetes.io/name: insighthub
      app.kubernetes.io/instance: insighthub
      app.kubernetes.io/component: api
  endpoints:
    - port: http
      path: /metrics
      honorLabels: true
      interval: {{ .Values.scrapeInterval }}
      scrapeTimeout: 10s
---
