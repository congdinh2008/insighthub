{{- if .Values.mcp.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.mcp.serviceAccountName }}
  namespace: {{ .Values.applicationNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: insighthub-day4-mcp-readonly
  namespace: {{ .Values.applicationNamespace }}
rules:
  - apiGroups: [""]
    resources: [pods, events, services]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, replicasets, statefulsets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: insighthub-day4-mcp-readonly
  namespace: {{ .Values.applicationNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Values.mcp.serviceAccountName }}
    namespace: {{ .Values.applicationNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: insighthub-day4-mcp-readonly
{{- end }}
