name: Day 01 baseline and async ingestion
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  local-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: insighthub-ci
      RAG_MODE: fixture
      LLM_PROVIDER: fixture
      EMBEDDING_PROVIDER: fixture
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and run local fixture
        run: docker compose up --build -d --wait
      - name: Verifier regression tests
        run: python3 -m unittest discover -s tests -p 'test_verify*.py' -v
      - name: Build isolated Python 3.12 test runner
        run: make test-image
      - name: API unit, isolated database integration and worker tests
        run: make test-backend test-worker
      - name: Install locked quality and milestone tooling
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --require-hashes -r requirements-dev.txt
      - name: Day 01 live contracts and strict quality checks
        run: |
          make test-day1 lint typecheck PYTHON=.venv/bin/python
          PATH="$PWD/.venv/bin:$PATH" pre-commit run --all-files
      - name: MCP actual SDK tests
        run: |
          docker run --rm --network host -v "$PWD:/work" -w /work node:24.20.0-alpine@sha256:e67514e5d0f6c46656005e1b693b2ec9d52e80b641307de684d4a015ba7a4eaf sh -ec '
            npm ci --prefix tools/mcp --ignore-scripts
            npm --prefix tools/mcp test
            node tools/mcp/smoke.mjs
            node tools/mcp/smoke.mjs --live
          '
      - name: HTTP smoke
        run: python3 scripts/verify.py smoke --json
      - name: Remove this CI project and its ephemeral data
        if: always()
        run: docker compose --profile ollama down --volumes --remove-orphans
  chatops-day5:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      redis:
        image: redis:7-alpine@sha256:6ab0b6e7381779332f97b8ca76193e45b0756f38d4c0dcda72dbb3c32061ab99
        ports:
          - 16380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      CHATOPS_REDIS_URL: redis://127.0.0.1:16380/0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked bot and quality dependencies
        run: |
          python3 -m venv .venv-day5
          .venv-day5/bin/pip install --require-hashes -r requirements-dev.txt
          .venv-day5/bin/pip install --require-hashes -r chatops-bot/requirements.txt
      - name: Test Day 05 bot and milestone contracts
        run: .venv-day5/bin/python -m pytest -q chatops-bot/tests tests/milestones/day5
      - name: Check Day 05 code quality
        run: |
          .venv-day5/bin/ruff check chatops-bot/app chatops-bot/tests tests/milestones/day5 tools/mcp/day5
          .venv-day5/bin/mypy --follow-untyped-imports --ignore-missing-imports chatops-bot/app
