name: Infrastructure as Code

on:
  pull_request:
    paths:
      - "infra/**"
      - "policy/terraform/**"
      - ".github/workflows/iac.yml"
  push:
    branches:
      - main
      - prod
    paths:
      - "infra/**"
      - "policy/terraform/**"
      - ".github/workflows/iac.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: iac-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  TF_VAR_aws_region: ${{ vars.AWS_REGION }}
  TF_VAR_project: ${{ vars.TF_VAR_PROJECT }}
  TF_VAR_owner: ${{ vars.TF_VAR_OWNER }}
  TF_VAR_cost_center: ${{ vars.TF_VAR_COST_CENTER }}
  TF_VAR_cluster_name: ${{ vars.TF_VAR_CLUSTER_NAME }}
  TF_VAR_kubernetes_version: ${{ vars.TF_VAR_KUBERNETES_VERSION }}
  TF_VAR_vpc_cidr: ${{ vars.TF_VAR_VPC_CIDR }}
  TF_VAR_private_subnets: ${{ vars.TF_VAR_PRIVATE_SUBNETS }}
  TF_VAR_eks_node_instance_types: ${{ vars.TF_VAR_EKS_NODE_INSTANCE_TYPES }}
  TF_VAR_eks_node_desired_size: ${{ vars.TF_VAR_EKS_NODE_DESIRED_SIZE }}
  TF_VAR_eks_node_min_size: ${{ vars.TF_VAR_EKS_NODE_MIN_SIZE }}
  TF_VAR_eks_node_max_size: ${{ vars.TF_VAR_EKS_NODE_MAX_SIZE }}
  TF_VAR_rds_instance_class: ${{ vars.TF_VAR_RDS_INSTANCE_CLASS }}
  TF_VAR_rds_allocated_storage: ${{ vars.TF_VAR_RDS_ALLOCATED_STORAGE }}
  TF_VAR_rds_engine_version: ${{ vars.TF_VAR_RDS_ENGINE_VERSION }}
  TF_VAR_redis_node_type: ${{ vars.TF_VAR_REDIS_NODE_TYPE }}
  TF_VAR_redis_engine_version: ${{ vars.TF_VAR_REDIS_ENGINE_VERSION }}

jobs:
  fmt_tflint:
    name: fmt and tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.60.0
      - name: Check Terraform formatting
        working-directory: infra
        run: terraform fmt -check -recursive
      - name: Initialize TFLint plugins
        working-directory: infra
        run: tflint --init
      - name: Lint Terraform
        working-directory: infra
        run: tflint --recursive

  checkov:
    name: checkov security scan
    needs: fmt_tflint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          quiet: true
          soft_fail: false

  conftest:
    name: conftest Rego policy check
    needs: checkov
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: insighthub-iac-policy-${{ github.run_id }}
      - name: Initialize remote state backend
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Create plan JSON for policy evaluation
        working-directory: infra
        run: |
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > tfplan.json
      - name: Evaluate Rego policies
        working-directory: infra
        run: |
          docker run --rm \
            --volume "$PWD:/workspace" \
            --workdir /workspace \
            openpolicyagent/conftest:v0.59.0 \
            test --policy ../policy/terraform tfplan.json

  plan_cost:
    name: terraform plan and infracost
    needs: conftest
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: insighthub-iac-plan-${{ github.run_id }}
      - name: Initialize remote state backend
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - name: Create reviewed plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan
      - name: Produce Infracost estimate
        working-directory: infra
        run: |
          set -o pipefail
          infracost breakdown --path . --terraform-plan-flags="-input=false" --format table | tee infracost.txt
      - name: Publish plan and estimate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iac-plan-${{ github.sha }}
          path: |
            infra/tfplan
            infra/infracost.txt
          if-no-files-found: error
          retention-days: 7

  apply:
    name: terraform apply
    needs: plan_cost
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/prod')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.9"
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_IAC_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: insighthub-iac-apply-${{ github.run_id }}
      - name: Initialize remote state backend
        working-directory: infra
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ vars.TF_STATE_KEY }}" \
            -backend-config="region=${{ vars.AWS_REGION }}"
      - uses: actions/download-artifact@v4
        with:
          name: iac-plan-${{ github.sha }}
          path: infra
      - name: Apply the reviewed plan
        working-directory: infra
        run: terraform apply -input=false tfplan
