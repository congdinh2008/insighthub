# Five default services; ingestion runs asynchronously through Redis/ARQ.
name: insighthub-do2603
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: insighthub
      POSTGRES_PASSWORD: insighthub
      POSTGRES_DB: insighthub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insighthub -d insighthub"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
  api:
    build: ./api
    environment: &app-environment
      DATABASE_URL: postgresql://insighthub:insighthub@postgres:5432/insighthub
      REDIS_URL: redis://redis:6379
      RAG_MODE: ${RAG_MODE:-fixture}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fixture}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-3.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
    ports: ["127.0.0.1:${API_PORT:-8000}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    mem_limit: 1g
  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports: ["127.0.0.1:${WEB_PORT:-3000}:3000"]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "always"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m
  ingestion-worker:
    build:
      context: .
      dockerfile: ingestion-worker/Dockerfile
    environment: *app-environment
    stop_grace_period: 330s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "arq", "--check", "worker.WorkerSettings"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    mem_limit: 1g
  ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    profiles: ["ollama"]
    volumes: ["ollama-data:/root/.ollama"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    # CPU container is optional. On macOS prefer native Ollama for Metal.
volumes:
  redis-data:
  pgdata:
  ollama-data:
