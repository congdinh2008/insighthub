apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-ingestion-worker
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-worker
spec:
  replicas: {{ .Values.worker.replicas }}
  revisionHistoryLimit: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ingestion-worker
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ingestion-worker
    spec:
      serviceAccountName: {{ include "insighthub.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.awsSecrets.enabled }}
      terminationGracePeriodSeconds: {{ .Values.worker.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ingestion-worker
          image: "{{ .Values.images.worker.repository }}:{{ .Values.images.worker.tag }}"
          imagePullPolicy: {{ .Values.images.worker.pullPolicy }}
          ports:
            - {name: monitor, containerPort: 8081}
          envFrom:
            - configMapRef: {name: {{ include "insighthub.fullname" . }}-config}
            - secretRef: {name: {{ .Values.secret.existingSecret }} }
          startupProbe:
            httpGet: {path: /healthz, port: monitor}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /readyz, port: monitor}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: monitor}
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
          {{- if .Values.awsSecrets.enabled }}
            - {name: runtime-secrets, mountPath: /mnt/secrets, readOnly: true}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
      {{- if .Values.awsSecrets.enabled }}
        - name: runtime-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "insighthub.fullname" . }}-runtime
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-ingestion-worker
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-worker
spec:
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion-worker
  ports:
    - {name: monitor, port: 8081, targetPort: monitor}
