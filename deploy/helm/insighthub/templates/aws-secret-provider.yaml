{{- if .Values.awsSecrets.enabled }}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "insighthub.fullname" . }}-runtime
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  provider: aws
  parameters:
    usePodIdentity: "false"
    objects: |
      - objectName: {{ required "awsSecrets.secretArn is required" .Values.awsSecrets.secretArn | quote }}
        objectType: secretsmanager
        jmesPath:
          - path: DATABASE_URL
            objectAlias: DATABASE_URL
          - path: REDIS_URL
            objectAlias: REDIS_URL
          - path: RAG_MODE
            objectAlias: RAG_MODE
          - path: LLM_PROVIDER
            objectAlias: LLM_PROVIDER
          - path: EMBEDDING_PROVIDER
            objectAlias: EMBEDDING_PROVIDER
          - path: GEMINI_API_KEY
            objectAlias: GEMINI_API_KEY
          - path: GEMINI_CHAT_MODEL
            objectAlias: GEMINI_CHAT_MODEL
          - path: GEMINI_EMBEDDING_MODEL
            objectAlias: GEMINI_EMBEDDING_MODEL
  secretObjects:
    - secretName: {{ .Values.secret.existingSecret }}
      type: Opaque
      data:
        - objectName: DATABASE_URL
          key: DATABASE_URL
        - objectName: REDIS_URL
          key: REDIS_URL
        - objectName: RAG_MODE
          key: RAG_MODE
        - objectName: LLM_PROVIDER
          key: LLM_PROVIDER
        - objectName: EMBEDDING_PROVIDER
          key: EMBEDDING_PROVIDER
        - objectName: GEMINI_API_KEY
          key: GEMINI_API_KEY
        - objectName: GEMINI_CHAT_MODEL
          key: GEMINI_CHAT_MODEL
        - objectName: GEMINI_EMBEDDING_MODEL
          key: GEMINI_EMBEDDING_MODEL
{{- end }}
