{{- if .Values.runtime.localDataServices }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insighthub.fullname" . }}-db-init
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
data:
  init.sql: |
{{ .Files.Get "files/init.sql" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: prepare-storage
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-ec", "chown -R 999:999 /var/lib/postgresql/data /var/run/postgresql && chmod 700 /var/lib/postgresql/data && chmod 3775 /var/run/postgresql"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: postgres-run, mountPath: /var/run/postgresql}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - {name: postgres, containerPort: 5432}
          env:
            - {name: POSTGRES_USER, value: insighthub}
            - {name: POSTGRES_PASSWORD, value: insighthub}
            - {name: POSTGRES_DB, value: insighthub}
          volumeMounts:
            - {name: data, mountPath: /var/lib/postgresql/data}
            - {name: init, mountPath: /docker-entrypoint-initdb.d/init.sql, subPath: init.sql, readOnly: true}
            - {name: postgres-run, mountPath: /var/run/postgresql}
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "insighthub", "-d", "insighthub"]}
            periodSeconds: 5
          livenessProbe:
            exec: {command: ["pg_isready", "-U", "insighthub", "-d", "insighthub"]}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: init
          configMap: {name: {{ include "insighthub.fullname" . }}-db-init}
        - name: postgres-run
          emptyDir: {sizeLimit: 16Mi}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: {{ .Values.postgres.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
  ports:
    - {name: postgres, port: 5432, targetPort: postgres}
{{- end }}
