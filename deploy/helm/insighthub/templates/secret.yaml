{{- if .Values.secret.createLocal }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secret.existingSecret }}
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ .Values.secret.databaseUrl | quote }}
  REDIS_URL: {{ .Values.secret.redisUrl | quote }}
{{- end }}
