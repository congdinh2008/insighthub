{{- if .Values.runtime.localDataServices }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: IfNotPresent
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "always", "--maxmemory-policy", "noeviction"]
          ports:
            - {name: redis, containerPort: 6379}
          volumeMounts:
            - {name: data, mountPath: /data}
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 3
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
        {{- if .Values.monitoring.enabled }}
        - name: redis-exporter
          image: {{ .Values.monitoring.redisExporter.image }}
          imagePullPolicy: IfNotPresent
          env:
            - {name: REDIS_ADDR, value: redis://127.0.0.1:6379}
            - name: REDIS_EXPORTER_CHECK_SINGLE_KEYS
              value: {{ printf "db0=%s" .Values.runtime.queueName | quote }}
          ports:
            - {name: metrics, containerPort: 9121}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.monitoring.redisExporter.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
        {{- end }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: {storage: {{ .Values.redis.storage }}}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - {name: redis, port: 6379, targetPort: redis}
    {{- if .Values.monitoring.enabled }}
    - {name: metrics, port: 9121, targetPort: metrics}
    {{- end }}
{{- end }}
