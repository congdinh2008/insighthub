apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-readonly
  namespace: insighthub
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mcp-readonly-role
  namespace: insighthub
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - events
      - services
      - configmaps
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mcp-readonly-binding
  namespace: insighthub
subjects:
  - kind: ServiceAccount
    name: mcp-readonly
    namespace: insighthub
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mcp-readonly-role
