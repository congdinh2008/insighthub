[tool.ruff]
target-version = "py312"
line-length = 88
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
[tool.mypy]
python_version = "3.12"
strict = true
files = ["api/app", "ingestion-worker/worker.py"]
[tool.pytest.ini_options]
pythonpath = ["api", "api/tests", "ingestion-worker"]
testpaths = ["api/tests", "ingestion-worker/tests"]
