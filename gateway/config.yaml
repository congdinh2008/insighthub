# Prices verified in ZenLayer Model Catalog, 2026-09-29; see pricing.json.
model_list:
  - model_name: app-chat
    litellm_params: &chat
      model: openai/gpt-4.1-mini
      api_base: os.environ/ZENLAYER_BASE_URL
      api_key: os.environ/ZENLAYER_API_KEY
      input_cost_per_token: 0.0000004
      output_cost_per_token: 0.0000016
      cache_read_input_token_cost: 0.0000001
      max_tokens: 1024
      temperature: 0
    model_info: {mode: chat}
  - model_name: bot-chat
    litellm_params: *chat
    model_info: {mode: chat}
  - model_name: coding-chat
    litellm_params: *chat
    model_info: {mode: chat}
  - model_name: guard-classifier
    litellm_params: *chat
    model_info: {mode: chat}
  - model_name: eval-chat
    litellm_params: *chat
    model_info: {mode: chat}
  - model_name: app-embedding
    litellm_params:
      model: openai/text-embedding-3-large
      api_base: os.environ/ZENLAYER_BASE_URL
      api_key: os.environ/ZENLAYER_API_KEY
      input_cost_per_token: 0.00000013
      output_cost_per_token: 0
    model_info: {mode: embedding}
litellm_settings:
  callbacks: [day6_hooks.policy]
  turn_off_message_logging: true
  set_verbose: false
  json_logs: true
  request_timeout: 45
  num_retries: 0
  telemetry: false
router_settings:
  num_retries: 0
  timeout: 45
  cache_responses: false
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
  store_prompts_in_spend_logs: false
  disable_error_logs: true
  proxy_batch_write_at: 5
  enforce_user_param: false
